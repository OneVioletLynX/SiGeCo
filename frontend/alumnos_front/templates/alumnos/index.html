{% extends "shared/base.html" %}
{% load static %}

{% block title %}Alumnos{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'shared/css/alumnos.css' %}">
{% endblock %}

{% block content %}
<div class="table-wrapper">

    <div class="form-header">
        <h1>Alumnos</h1>
    </div>

    <div class="filter-container" style="justify-content: space-between;">
        <div class="filter-container" style="margin-bottom:0;">
            <div>
                <label for="buscadorAlumno">Buscar</label>
                <input type="text" id="buscadorAlumno" class="form-control" placeholder="Nombre o apellido">
            </div>
            <div>
                <label for="filtroEstado">Estado</label>
                <select id="filtroEstado" class="form-select filtro">
                    <option value="all">Todos</option>
                </select>
            </div>
            <div>
                <label for="filtroCarrera">Carrera</label>
                <select id="filtroCarrera" class="form-select filtro">
                    <option value="all">Todas</option>
                </select>
            </div>
        </div>
        <a href="{% url 'alumnos_front:alumno_nuevo' %}" class="button-predeterminado" style="align-self:flex-end;">
            <span class="material-icons" style="font-size:1.1rem; vertical-align:middle;">add</span>
            Nuevo Alumno
        </a>
    </div>

    <table id="tablaAlumnos">
        <thead>
            <tr>
                <th style="width:48px;"></th>
                <th>Apellido y Nombre</th>
                <th>Carrera</th>
                <th>Estado</th>
                <th class="acciones-col">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:0.75rem;">
        <span id="contadorAlumnos" style="font-size:0.82rem; color:var(--text-muted);"></span>
        <nav aria-label="Paginación" class="ulpgcds-pager" style="margin-top:0;">
            <ul id="paginador"></ul>
        </nav>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'shared/js/alumnos.js' %}"></script>
{% endblock %}
