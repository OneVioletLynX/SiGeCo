{% extends "shared/base.html" %}
{% load static %}
{% block title %}Inicio{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'shared/css/alumnos.css' %}">
{% endblock %}
{% block content %}


<div class="table-wrapper">
    <div class="filter-container" style="justify-content: space-between;">
        <div class="filter-container">
            <div style="display:flex ; flex-direction: column;">
                <label for="buscadorAlumno" class="form-label fw-bold">Buscar</label>
                <input type="text" id="buscadorAlumno" class="form-control" placeholder="Nombre">
            </div>

            <div style="display:flex ; flex-direction: column;">
                <label for="filtroEstado" class="form-label fw-bold">Estados</label>
                <select id="filtroEstado" class="form-select filtro">
                    <option value="all" selected>Todos</option>
                </select>
            </div>

            <div style="display:flex ; flex-direction: column;">
                <label for="filtroCarrera" class="form-label fw-bold">Carreras</label>
                <select id="filtroCarrera" class="form-select filtro">
                    <option value="all">Todas</option>
                </select>
            </div>
        </div>

        <button id="btnAltaAlumno" class="button-predeterminado">
            <img src="{% static 'shared/assets/add.svg' %}" alt="" />
            <span class="text">Nuevo Alumno</span>
        </button>

    </div>

    <table id="tablaAlumnos">
        <thead>
            <tr>
                <th>Apellido y Nombre</th>
                <th>Carrera</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <nav aria-label="Paginación" class="ulpgcds-pager">
        <ul id="paginador"></ul>
    </nav>
</div>



<div id="altaModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Nuevo Alumno</h2>

        <form id="alumnoForm">
            {% csrf_token %}
            <div class="gc-2">
                <label for="legajo">Legajo</label>
                <input type="text" name="legajo" placeholder="C-43927814">
            </div>

            <div class="gc-2">
                <label for="id_estado">Estado</label>
                <select name="id_estado" id="id_estado" class="form-select">
                    <option value="" disabled selected>Seleccione un estado</option>
                </select>
            </div>

            <div class="gc-2">
                <label for="">Carrera</label>
                <select name="id_carrera" id="id_carrera" class="form-select">
                    <option value="" disabled selected>Seleccione una carrera</option>
                </select>
            </div>


            <div class="gc-2">
                <label for="">Año de Ingreso</label>
                <select name="anio_ingreso">
                    <option value=2025>2025</option>
                    <option value=2025>2026</option>
                </select>
            </div>

            <div class="gc-2">
                <label for="">Nombre</label>
                <input type="text" name="nombre" placeholder="Carlos">
            </div>
            <div class="gc-2">
                <label for="">Apellido</label>
                <input type="text" name="apellido" placeholder="Cáceres">
            </div>
            <div class="gc-2">
                <label for="">Nro de Documento</label>
                <input type="number" name="dni" placeholder="43927814">
            </div>
            <div class="gc-2">
                <label for="">Fecha de Nacimiento</label>
                <input type="date" name="fecha_nacimiento">

            </div>
            <div class="gc-2">
                <label for="">Localidad</label>
                <select name="ciudad">
                    <option value="1">Marcos Juarez</option>
                    <option value="2">Leones</option>
                    <option value="3">Inriville</option>
                </select>
            </div>
            <div>
                <label for="">Direccion</label>
                <input type="text" name="direccion" placeholder="Sargento Cabral">
            </div>
            <div>
                <label for="">Numero</label>
                <input type="number" name="numero" placeholder="720">
            </div>
            <div>
                <label for="">Prefijo</label>
                <input type="number" name="prefijo" placeholder="3472">
            </div>
            <div>
                <label for="">Celular</label>
                <input type="number" name="telefono" placeholder="638644">
            </div>
            <div class="gc-2">
                <label for="">Correo</label>
                <input type="email" name="email" placeholder="kalicaceres1@gmail.com">
            </div>


            <button id="submitBtn" type="submit">Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'shared/js/alumnos.js' %}"></script>
{% endblock %}
