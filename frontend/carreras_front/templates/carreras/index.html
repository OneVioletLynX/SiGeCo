{% extends "shared/base.html" %}
{% load static %}

{% block title %}Carreras{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'shared/css/carreras.css' %}">
{% endblock %}

{% block content %}
<div class="table-wrapper">

  <!-- Encabezado de página -->
  <div class="form-header">
    <h1>Carreras</h1>
  </div>

  <!-- Buscador + botón -->
  <div class="filter-container" id="barraBusqueda" style="justify-content: space-between;">
    <div>
      <label for="buscadorCarrera">Buscar</label>
      <input type="text" id="buscadorCarrera" class="form-control" placeholder="Nombre de carrera" style="width:260px;">
    </div>
    <button class="button-predeterminado" id="btnNuevaCarrera" style="align-self:flex-end;">
      <span class="material-icons" style="font-size:1.1rem; vertical-align:middle;">add</span>
      Nueva Carrera
    </button>
  </div>

  <!-- Formulario inline (oculto por defecto) -->
  <div id="seccionFormCarrera" style="display:none; margin-bottom:1.5rem;">
    <div class="carrera-form-card">

      <div class="carrera-form-header">
        <h2 id="formCarreraTitle">Nueva Carrera</h2>
      </div>

      <form id="formCarrera">
        {% csrf_token %}
        <input type="hidden" id="carreraId">
        <input type="hidden" id="colorCarrera">

        <div class="form-field">
          <label for="descripcion">Nombre *</label>
          <input type="text" id="descripcion" placeholder="Ej: Tecnicatura en Informática">
          <span class="error-msg" id="error-descripcion"></span>
        </div>

        <div class="form-field">
          <label>Color identificador</label>
          <div class="color-picker" id="colorPicker"></div>
          <div class="chip-preview">
            <span class="chip-demo">
              <span class="dot"></span>
              Carrera ejemplo
            </span>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-field">
            <label for="inscripcion">Inscripción *</label>
            <input type="number" id="inscripcion" placeholder="0" min="0">
            <span class="error-msg" id="error-inscripcion"></span>
          </div>
          <div class="form-field">
            <label for="cuota">Cuota mensual *</label>
            <input type="number" id="cuota" placeholder="0" min="0">
            <span class="error-msg" id="error-cuota"></span>
          </div>
        </div>

        <div class="carrera-form-footer">
          <button type="button" class="btn-cancelar" id="btnCancelarForm">Cancelar</button>
          <button type="submit" class="btn-guardar-modal" id="btnGuardarCarrera">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla -->
  <table id="sortableTable">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Cuota</th>
        <th>Inscripción</th>
        <th class="acciones-col">Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-carreras"></tbody>
  </table>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'shared/js/carreras.js' %}?v=4"></script>
{% endblock %}
