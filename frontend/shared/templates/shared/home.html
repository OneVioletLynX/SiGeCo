{% extends "shared/base.html" %}
{% load static %}

{% block title %}Inicio{% endblock %}

{% block extra_css %}
<style>
  .home-container {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* ---- Tarjeta genérica ---- */
  .home-card {
    background: var(--background-color, #fff);
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 12px;
    padding: 1.5rem 2rem;
  }

  .card-titulo {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted, #888);
    margin-bottom: 1rem;
  }

  /* ---- Mes en curso ---- */
  .mes-nombre {
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--text-title-color, #111);
    margin-bottom: 1.25rem;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .stat-box {
    background: #f9fafb;
    border-radius: 8px;
    padding: 0.9rem 1rem;
    text-align: center;
  }

  .stat-box .stat-num {
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 0.25rem;
  }

  .stat-box .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted, #888);
    font-weight: 500;
  }

  .stat-box.total      .stat-num { color: #374151; }
  .stat-box.pagadas    .stat-num { color: #16a34a; }
  .stat-box.pendientes .stat-num { color: #dc2626; }

  .btn-generar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--color-primary, #053D4E);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.4rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: inherit;
  }
  .btn-generar:hover    { opacity: 0.88; }
  .btn-generar:disabled { opacity: 0.5; cursor: not-allowed; }

  .tag-generadas {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: #dcfce7; color: #166534;
    border-radius: 20px; padding: 0.3rem 0.9rem;
    font-size: 0.82rem; font-weight: 600;
  }
  .tag-pendiente {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: #fef9c3; color: #854d0e;
    border-radius: 20px; padding: 0.3rem 0.9rem;
    font-size: 0.82rem; font-weight: 600;
  }

  .solo-secretaria { display: none; }
  #mensajeResultado { margin-top: 0.8rem; font-size: 0.9rem; min-height: 1.2rem; }

  /* ---- Feed de actividad ---- */
  .feed-empty {
    color: var(--text-muted, #9ca3af);
    font-size: 0.88rem;
    padding: 1rem 0;
    text-align: center;
  }

  .feed-item {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border-color, #f3f4f6);
  }
  .feed-item:last-child { border-bottom: none; }

  .feed-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .feed-icon--ALTA         { background: #dcfce7; color: #16a34a; }
  .feed-icon--MODIFICACION { background: #e0f2fe; color: #0284c7; }
  .feed-icon--BAJA         { background: #fee2e2; color: #dc2626; }
  .feed-icon--COBRO        { background: #f0fdf4; color: #15803d; }

  .feed-body { flex: 1; min-width: 0; }

  .feed-desc {
    font-size: 0.875rem;
    color: var(--text-color, #374151);
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .feed-meta {
    font-size: 0.75rem;
    color: var(--text-muted, #9ca3af);
    margin-top: 0.1rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="home-container">

  <!-- =====================
       CARD: Mes en curso
  ====================== -->
  <div class="home-card" id="cardMes">
    <div class="card-titulo">Mes en curso</div>
    <div class="mes-nombre" id="mesNombre">Cargando...</div>

    <div class="stats-grid" id="statsGrid" style="display:none">
      <div class="stat-box total">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">Cuotas totales</div>
      </div>
      <div class="stat-box pagadas">
        <div class="stat-num" id="statPagadas">—</div>
        <div class="stat-label">Pagadas</div>
      </div>
      <div class="stat-box pendientes">
        <div class="stat-num" id="statPendientes">—</div>
        <div class="stat-label">Pendientes</div>
      </div>
    </div>

    <div id="estadoGeneracion" style="margin-bottom:1rem;"></div>

    <div class="solo-secretaria" id="seccionGenerar">
      <button class="btn-generar" id="btnGenerar">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
        </svg>
        Generar cuotas del mes
      </button>
      <div id="mensajeResultado"></div>
    </div>
  </div>

  <!-- =====================
       CARD: Actividad reciente
  ====================== -->
  <div class="home-card">
    <div class="card-titulo">Actividad reciente</div>
    <div id="activityFeed">
      <div class="feed-empty">Cargando...</div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  const API_BASE = "http://127.0.0.1:8000";

  function getToken() {
    return localStorage.getItem("sigeco_access") || "";
  }

  function logout() {
    localStorage.removeItem("sigeco_access");
    localStorage.removeItem("sigeco_refresh");
    localStorage.removeItem("sigeco_rol");
    localStorage.removeItem("sigeco_nombre");
    localStorage.removeItem("sigeco_permisos");
    document.cookie = "sigeco_access=; path=/; max-age=0";
    window.location.href = "http://127.0.0.1:8001/";
  }

  async function authFetch(url, options = {}) {
    const token = getToken();
    const headers = { ...(options.headers || {}), "Authorization": `Bearer ${token}` };
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) { logout(); return; }
    return resp;
  }

  const rol = localStorage.getItem("sigeco_rol") || "";

  if (rol === "ADMIN" || rol === "SECRETARIA") {
    document.getElementById("seccionGenerar").style.display = "block";
  }

  // ============================
  // Resumen mes
  // ============================
  async function cargarResumen() {
    try {
      const resp = await authFetch(`${API_BASE}/ctacte/resumen-mes/`);
      if (!resp) return;
      const data = await resp.json();

      document.getElementById("mesNombre").textContent = `${data.mes} ${data.anio}`;
      document.getElementById("statTotal").textContent      = data.cuotas_total;
      document.getElementById("statPagadas").textContent    = data.cuotas_pagadas;
      document.getElementById("statPendientes").textContent = data.cuotas_pendientes;
      document.getElementById("statsGrid").style.display    = data.ya_generadas ? "grid" : "none";

      const estadoDiv  = document.getElementById("estadoGeneracion");
      const btnGenerar = document.getElementById("btnGenerar");

      if (data.ya_generadas) {
        estadoDiv.innerHTML = `<span class="tag-generadas">✓ Cuotas generadas</span>`;
        if (btnGenerar) btnGenerar.textContent = "Regenerar cuotas";
      } else {
        estadoDiv.innerHTML = `<span class="tag-pendiente">⚠ Cuotas no generadas aún</span>`;
      }
    } catch (err) {
      console.error("Error cargando resumen:", err);
    }
  }

  const btnGenerar = document.getElementById("btnGenerar");
  if (btnGenerar) {
    btnGenerar.addEventListener("click", async () => {
      btnGenerar.disabled     = true;
      btnGenerar.textContent  = "Generando...";
      const msg = document.getElementById("mensajeResultado");
      try {
        const resp = await authFetch(`${API_BASE}/ctacte/generar-cuotas/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });
        if (!resp) return;
        const data = await resp.json();
        if (data.warning) {
          msg.innerHTML = `<span style="color:#854d0e;">⚠ ${data.warning}</span>`;
        } else {
          msg.innerHTML = `<span style="color:#16a34a;">✓ ${data.generadas} cuotas generadas correctamente.</span>`;
          await cargarResumen();
        }
      } catch {
        msg.innerHTML = `<span style="color:#dc2626;">Error al generar cuotas.</span>`;
      } finally {
        btnGenerar.disabled    = false;
        btnGenerar.textContent = "Regenerar cuotas";
      }
    });
  }

  // ============================
  // Feed de actividad
  // ============================
  const ICONOS = {
    ALTA:         { label: '+', clase: 'feed-icon--ALTA'         },
    MODIFICACION: { label: '✎', clase: 'feed-icon--MODIFICACION' },
    BAJA:         { label: '−', clase: 'feed-icon--BAJA'         },
    COBRO:        { label: '$', clase: 'feed-icon--COBRO'        },
  };

  function tiempoRelativo(iso) {
    const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (diff < 60)     return 'hace un momento';
    if (diff < 3600)   return `hace ${Math.floor(diff / 60)} min`;
    if (diff < 86400)  return `hace ${Math.floor(diff / 3600)} h`;
    if (diff < 172800) return 'ayer';
    return new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
  }

  async function cargarFeed() {
    const contenedor = document.getElementById("activityFeed");
    try {
      const resp = await authFetch(`${API_BASE}/api/auditoria/?limit=15`);
      if (!resp || !resp.ok) {
        contenedor.innerHTML = `<div class="feed-empty">No se pudo cargar la actividad.</div>`;
        return;
      }
      const registros = await resp.json();

      if (!registros.length) {
        contenedor.innerHTML = `<div class="feed-empty">Sin actividad registrada aún.</div>`;
        return;
      }

      contenedor.innerHTML = "";
      registros.forEach(r => {
        const cfg  = ICONOS[r.accion] || { label: '·', clase: '' };
        const por  = r.usuario_nombre ? `por ${r.usuario_nombre}` : '';
        const item = document.createElement("div");
        item.className = "feed-item";
        item.innerHTML = `
          <div class="feed-icon ${cfg.clase}">${cfg.label}</div>
          <div class="feed-body">
            <div class="feed-desc">${r.descripcion}</div>
            <div class="feed-meta">${[por, tiempoRelativo(r.fecha)].filter(Boolean).join(' · ')}</div>
          </div>
        `;
        contenedor.appendChild(item);
      });
    } catch (err) {
      contenedor.innerHTML = `<div class="feed-empty">Error al cargar actividad.</div>`;
    }
  }

  cargarResumen();
  cargarFeed();
})();
</script>
{% endblock %}
