<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Iniciar sesión</h1>
    <form id="loginForm">
        <label>Email:</label>
        <input type="email" id="email" required>
        <br>
        <label>Contraseña:</label>
        <input type="password" id="password" required>
        <br>
        <button type="submit">Ingresar</button>
    </form>
    <div id="mensaje"></div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://127.0.0.1:8000/api/login/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById("mensaje").innerText = "Login exitoso ✅";
                    // Guardar tokens en localStorage
                    localStorage.setItem("access", data.access);
                    localStorage.setItem("refresh", data.refresh);
                } else {
                    document.getElementById("mensaje").innerText = "Error: " + (data.detail || data.non_field_errors || "credenciales inválidas");
                }
            } catch (error) {
                document.getElementById("mensaje").innerText = "Error de conexión al backend";
            }
        });
    </script>
</body>
</html>
