{% extends "shared/base.html" %}
{% load static %}

{% block title %}Reporte de Alumnos{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'shared/css/reportes_pdf.css' %}?v=2">
{% endblock %}

{% block content %}
<div class="table-wrapper">

    <div class="form-header">
        <h1>Reporte de Alumnos</h1>
        <a href="{% url 'reportes:reportes_index' %}" class="btn-secundario">← Reportes</a>
    </div>

    <div class="filter-container" style="justify-content: space-between;">
        <div class="filter-container" style="margin-bottom:0;">
            <div>
                <label for="filtroEstado">Estado</label>
                <select id="filtroEstado" class="form-select filtro">
                    <option value="all">Todos</option>
                </select>
            </div>
            <div>
                <label for="filtroCarrera">Carrera</label>
                <select id="filtroCarrera" class="form-select filtro">
                    <option value="all">Todas</option>
                </select>
            </div>
        </div>
        <button id="generar-pdf-btn" class="button-predeterminado" style="align-self:flex-end;">
            <span class="material-icons" style="font-size:1.1rem; vertical-align:middle;">picture_as_pdf</span>
            Generar PDF
        </button>
    </div>

    <div class="table-content-area">
        <table id="tabla-alumnos">
            <thead>
                <tr>
                    <th>Legajo</th>
                    <th>Apellido y Nombre</th>
                    <th>Documento</th>
                    <th>Estado</th>
                    <th>Carrera</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'shared/js/reportes.js' %}?v=2" defer></script>
{% endblock %}
