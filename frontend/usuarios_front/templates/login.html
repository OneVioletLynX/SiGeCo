<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeCo - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #fff; }
        .login-container { height: 100vh; overflow: hidden; }
        .bg-side {
            background-color: #1a237e;
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 3rem; position: relative;
        }
        .bg-side::after { content:""; position:absolute; top:0;left:0;right:0;bottom:0; background:url('https://www.transparenttextures.com/patterns/cubes.png'); opacity:0.1; }
        .brand-big { font-size: 4rem; font-weight: 800; letter-spacing: -2px; z-index: 2; }
        .brand-subtitle { font-size: 1.2rem; opacity: 0.8; font-weight: 300; text-align: center; max-width: 400px; z-index: 2; }
        .form-side { display: flex; align-items: center; justify-content: center; background-color: #fff; padding: 2rem; }
        .login-box { width: 100%; max-width: 400px; }
        .form-floating > .form-control { border:none; border-bottom:2px solid #e0e0e0; border-radius:0; padding-left:0; background-color:transparent; }
        .form-floating > .form-control:focus { box-shadow:none; border-color:#1a237e; }
        .form-floating > label { padding-left:0; color:#6c757d; }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label { transform:scale(0.85) translateY(-0.5rem) translateX(0); color:#1a237e; font-weight:600; }
        .btn-custom { background-color:#1a237e; color:white; padding:12px; border-radius:50px; font-weight:600; letter-spacing:1px; transition:all 0.3s; border:none; width:100%; }
        .btn-custom:hover { background-color:#303f9f; transform:translateY(-2px); box-shadow:0 4px 12px rgba(26,35,126,0.3); color:white; }
        .btn-custom:disabled { opacity:0.7; transform:none; }
    </style>
</head>
<body>
    <div class="container-fluid login-container">
        <div class="row h-100">

            <div class="col-md-6 col-lg-7 d-none d-md-flex bg-side flex-column justify-content-center align-items-center">
                <div class="brand-big">SiGeCo</div>
                <p class="brand-subtitle mt-3">Simplificamos la gestión, potenciamos la educación.</p>
                <div class="mt-5 opacity-50 small">&copy; {% now "Y" %} Versión 1.0</div>
            </div>

            <div class="col-md-6 col-lg-5 form-side">
                <div class="login-box">

                    <h3 class="fw-bold mb-1 text-dark">Bienvenido</h3>
                    <p class="text-muted mb-4">Ingresá tus credenciales para continuar.</p>

                    <form id="loginForm">
                        {% csrf_token %}
                        <div class="form-floating mb-4">
                            <input type="text" name="username" class="form-control" id="floatingUsername"
                                placeholder="usuario" autocomplete="username" required autofocus>
                            <label for="floatingUsername">Usuario</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" name="password" class="form-control" id="floatingPassword"
                                placeholder="Contraseña" autocomplete="current-password" required>
                            <label for="floatingPassword">Contraseña</label>
                        </div>

                        <div id="errorMsg" class="alert alert-danger d-none mb-3" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            <span id="errorText"></span>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-custom btn-lg" id="btnIngresar">INGRESAR</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {

        // Si ya hay token, renovar cookie y redirigir directo
        const tokenGuardado = localStorage.getItem("sigeco_access");
        if (tokenGuardado) {
            document.cookie = `sigeco_access=${tokenGuardado}; path=/; SameSite=Lax`;
            const rol = localStorage.getItem("sigeco_rol");
            window.location.href = rol === "ADMIN"
                ? "http://127.0.0.1:8000/usuarios/admin/dashboard/"
                : "http://127.0.0.1:8001/inicio";
            return;
        }

        const form        = document.getElementById("loginForm");
        const errorMsg    = document.getElementById("errorMsg");
        const errorText   = document.getElementById("errorText");
        const btnIngresar = document.getElementById("btnIngresar");

        function mostrarError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.remove("d-none");
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.classList.add("d-none");

            const username = document.getElementById("floatingUsername").value.trim();
            const password = document.getElementById("floatingPassword").value;

            if (!username || !password) {
                mostrarError("Completá usuario y contraseña.");
                return;
            }

            btnIngresar.disabled    = true;
            btnIngresar.textContent = "Ingresando...";

            try {
                const response = await fetch("http://127.0.0.1:8000/usuarios/api/login/", {
                    method:      "POST",
                    headers:     { "Content-Type": "application/json" },
                    credentials: "include",
                    body:        JSON.stringify({ username, password }),
                });

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    mostrarError("Error interno del servidor.");
                    return;
                }

                const data = await response.json();

                if (response.ok) {
                    // Guardar token, rol, nombre y permisos
                    localStorage.setItem("sigeco_access",   data.access);
                    localStorage.setItem("sigeco_refresh",  data.refresh);
                    localStorage.setItem("sigeco_rol",      data.rol);
                    localStorage.setItem("sigeco_nombre",   data.nombre);
                    localStorage.setItem("sigeco_permisos", JSON.stringify(data.permisos));

                    // Cookie para el middleware del frontend
                    document.cookie = `sigeco_access=${data.access}; path=/; SameSite=Lax`;

                    if (data.rol === "ADMIN") {
                        window.location.href = "http://127.0.0.1:8000/usuarios/admin/dashboard/";
                    } else {
                        window.location.href = "http://127.0.0.1:8001/inicio";
                    }
                } else {
                    mostrarError(data.error || "No se pudo iniciar sesión.");
                }

            } catch (err) {
                mostrarError("Error de conexión con el servidor.");
            } finally {
                btnIngresar.disabled    = false;
                btnIngresar.textContent = "INGRESAR";
            }
        });
    });
    </script>
</body>
</html>
