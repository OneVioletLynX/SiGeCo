<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeCo - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body, html {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #fff;
        }

        .login-container {
            height: 100vh;
            overflow: hidden;
        }

        /* --- COLUMNA IZQUIERDA (VISUAL) --- */
        .bg-side {
            background-color: #1a237e; /* Azul oscuro corporativo */
            /* Patrón de fondo sutil con CSS */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            position: relative;
        }
        
        .bg-side::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Textura sutil */
            opacity: 0.1;
        }

        .brand-big {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            z-index: 2;
        }
        
        .brand-subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            font-weight: 300;
            text-align: center;
            max-width: 400px;
            z-index: 2;
        }

        /* --- COLUMNA DERECHA (FORMULARIO) --- */
        .form-side {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            padding: 2rem;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        /* Estilo de Inputs (Floating Labels Custom) */
        .form-floating > .form-control {
            border: none;
            border-bottom: 2px solid #e0e0e0;
            border-radius: 0;
            padding-left: 0;
            background-color: transparent;
        }

        .form-floating > .form-control:focus {
            box-shadow: none;
            border-color: #1a237e; /* Mismo color que el panel izquierdo */
        }

        .form-floating > label {
            padding-left: 0;
            color: #6c757d;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-0.5rem) translateX(0);
            color: #1a237e;
            font-weight: 600;
        }

        .btn-custom {
            background-color: #1a237e;
            color: white;
            padding: 12px;
            border-radius: 50px; /* Botón redondeado */
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-custom:hover {
            background-color: #303f9f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.3);
            color: white;
        }

    </style>
</head>
<body>

<div class="container-fluid login-container">
    <div class="row h-100">
        
        <div class="col-md-6 col-lg-7 d-none d-md-flex bg-side">
            <div class="brand-big">SiGeCo</div>
            <p class="brand-subtitle mt-3">Simplificamos la gestión, potenciamos la educación.</p>
            <div class="mt-5 opacity-50 small">
                &copy; {% now "Y" %} Versión 1.0
            </div>
        </div>

        <div class="col-md-6 col-lg-5 form-side">
            <div class="login-box">
                
                <h3 class="fw-bold mb-1 text-dark">Bienvenido</h3>
                <p class="text-muted mb-4">Ingresa tus credenciales para continuar.</p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            <div>{{ message }}</div>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-floating mb-4">
                        <input type="email" name="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                        <label for="floatingInput">Correo Electrónico</label>
                    </div>

                    <div class="form-floating mb-5">
                        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                        <label for="floatingPassword">Contraseña</label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-custom btn-lg">
                            INGRESAR
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
