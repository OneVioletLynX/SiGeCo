<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeCo - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #fff; }
        .login-container { height: 100vh; overflow: hidden; }
        .bg-side {
            background-color: #1a237e;
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            position: relative;
        }
        .bg-side::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }
        .brand-big { font-size: 4rem; font-weight: 800; letter-spacing: -2px; z-index: 2; }
        .brand-subtitle { font-size: 1.1rem; opacity: 0.7; font-weight: 300; text-align: center; max-width: 340px; z-index: 2; }
        .brand-badge { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; z-index: 2; margin-top: 1rem; }
        .form-side { display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .login-box { width: 100%; max-width: 400px; }
        .form-floating > .form-control { border: none; border-bottom: 2px solid #e0e0e0; border-radius: 0; padding-left: 0; background-color: transparent; }
        .form-floating > .form-control:focus { box-shadow: none; border-color: #1a237e; }
        .form-floating > label { padding-left: 0; color: #6c757d; }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label { transform: scale(0.85) translateY(-0.5rem) translateX(0); color: #1a237e; font-weight: 600; }
        .btn-custom { background-color: #1a237e; color: white; padding: 12px; border-radius: 50px; font-weight: 600; letter-spacing: 1px; transition: all 0.3s; border: none; width: 100%; }
        .btn-custom:hover { background-color: #303f9f; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,35,126,0.3); color: white; }
        .btn-custom:disabled { opacity: 0.7; transform: none; }
    </style>
</head>
<body>
    <div class="container-fluid login-container">
        <div class="row h-100">

            <div class="col-md-6 col-lg-7 d-none d-md-flex bg-side flex-column justify-content-center align-items-center">
                <div class="brand-big">SiGeCo</div>
                <p class="brand-subtitle mt-3">Simplificamos la gestión, potenciamos la educación.</p>
                <span class="brand-badge">Panel de Administración</span>
                <div class="mt-5 opacity-50 small">&copy; {% now "Y" %} Versión 1.0</div>
            </div>

            <div class="col-md-6 col-lg-5 form-side">
                <div class="login-box">

                    <h3 class="fw-bold mb-1 text-dark">Bienvenido</h3>
                    <p class="text-muted mb-4">Ingresá tus credenciales para continuar.</p>

                    {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-danger d-flex align-items-center mb-4">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            <div>{{ message }}</div>
                        </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="form-floating mb-4">
                            <input type="text" name="username" class="form-control" id="floatingUsername"
                                placeholder="usuario" autocomplete="username" required autofocus>
                            <label for="floatingUsername">Usuario</label>
                        </div>

                        <div class="form-floating mb-5">
                            <input type="password" name="password" class="form-control" id="floatingPassword"
                                placeholder="Contraseña" autocomplete="current-password" required>
                            <label for="floatingPassword">Contraseña</label>
                        </div>

                        <button type="submit" class="btn btn-custom btn-lg">
                            INGRESAR
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
